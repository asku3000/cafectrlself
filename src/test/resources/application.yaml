# Test profile: in-memory H2 in MySQL compatibility mode, so tests never touch the real MySQL database.
# Flyway runs the real db/migration scripts; Hibernate (ddl-auto: update) creates the pre-existing tables.
spring:
  datasource:
    url: jdbc:h2:mem:cafectrl_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-test-secret-key-test-secret-key-0123456789
  expiration-ms: 86400000

app:
  super-admin:
    email: admin@test.local
    password: admin

frontend:
  url: http://localhost:3000

logging:
  level:
    root: WARN
    com.progameflixx.cafectrl: INFO

membership:
  expiry-job:
    enabled: false

audit:
  retention-days: 5
  purge:
    enabled: false
    batch-size: 1000
    batch-pause-ms: 0

idempotency:
  cleanup:
    enabled: false
