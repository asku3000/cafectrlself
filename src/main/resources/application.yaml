server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cafectrl_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: HikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update   # options: create | update | validate | none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          timezone: Asia/Kolkata

  sql:
    init:
      mode: always

  application:
    name: bookings

logging:
  # Every log line carries the request id, logged-in user, role and cafe (set via MDC),
  # e.g.  INFO [req=a1b2c3d4e5f6 user=owner@cafe.com role=CAFE_ADMIN cafe=7f3...] ...
  pattern:
    level: "%5p [req=%X{reqId:-} user=%X{user:-} role=%X{role:-} cafe=%X{cafeId:-}]"
  level:
    root: INFO
    com.progameflixx.cafectrl: ${LOG_LEVEL_APP:INFO}
    # Framework / SQL noise is off by default; raise via env vars when debugging, e.g. LOG_LEVEL_SQL=DEBUG
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_PARAMS:INFO}

# Optional - if you plan login with JWT later
jwt:
  secret: your-very-secure-secret-key-12345678
  expiration-ms: 86400000

# Super Admin Defaults
app:
  super-admin:
    email: admin@admin.com
    password: admin

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}